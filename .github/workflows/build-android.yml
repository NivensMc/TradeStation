name: Build TradeStation Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Generate Android Keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias tradestation -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=TradeStation, OU=Mobile, O=TradeStation, L=Istanbul, S=Istanbul, C=TR"
      - name: Init & Build APK
        run: |
          mkdir -p build-apk && cd build-apk
          yes "" | bubblewrap init --manifest="https://nivensmc.github.io/TradeStation/manifest.json"
          sed -i 's|"signingKey": {.*|"signingKey": { "path": "../android.keystore", "alias": "tradestation" },|' twa-manifest.json
          echo -e "android123\nandroid123" | bubblewrap build
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeStation-Android
          path: build-apk/*signed.apk
